name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: oikos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

  deploy:
    name: Deploy to exe.dev VM
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, oikos-prod]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DEPLOY_DIR: /home/exedev/apps/oikos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy checkout to stable deploy directory
        run: |
          rm -rf "$DEPLOY_DIR.tmp"
          mkdir -p "$DEPLOY_DIR.tmp"
          cp -a . "$DEPLOY_DIR.tmp/"
          rm -rf "$DEPLOY_DIR"
          mv "$DEPLOY_DIR.tmp" "$DEPLOY_DIR"

      - name: Build images
        run: |
          cd "$DEPLOY_DIR"
          docker compose build

      - name: Start the game and the authority
        run: |
          cd "$DEPLOY_DIR"
          docker compose up -d --remove-orphans
          docker compose ps

      - name: Check both are serving
        run: |
          for attempt in $(seq 1 10); do
            static=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3010/ || true)
            world=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3010/healthz || true)
            if [ "$static" = 200 ] && [ "$world" = 200 ]; then exit 0; fi
            sleep 3
          done
          echo "static $static, authority $world; see deploy/README.md for first-time world setup"
          cd "$DEPLOY_DIR"
          docker compose ps -a
          docker compose logs --tail 100 authority
          exit 1

      - name: Reload Caddy
        run: |
          sudo /usr/bin/caddy validate --config /etc/caddy/Caddyfile
          sudo /usr/bin/systemctl reload caddy
