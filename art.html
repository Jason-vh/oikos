<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oikos — Model atelier</title>
  </head>
  <body>
    <main id="app" aria-label="Model preview"></main>
    <header class="masthead"><div class="identity"><span class="eyebrow">Oikos · Art tools</span><h1>Model atelier</h1></div><nav><a href="/">Play island</a><a href="/miniature.html">Harbour benchmark</a></nav></header>
    <aside class="atelier"><label for="model">Model</label><select id="model"><option value="house:1">Dwelling</option><option value="house:2">Cottage</option><option value="house:3">Courtyard house</option><option value="farm:1:0">Wheat farm · sown</option><option value="farm:1:2">Wheat farm · growing</option><option value="farm:1:3">Wheat farm · ripe</option><option value="granary:1:0">Granary · empty</option><option value="granary:1:3">Granary · full</option><option value="agora:1">Empty agora</option><option value="agora:2:0">Agora + vendor · sold out</option><option value="agora:2:3">Agora + vendor · stocked</option><option value="fountain:1">Fountain</option><option value="maintenance:1">Maintenance post</option></select><p id="description"></p><dl id="metrics"></dl><label class="check"><input id="wireframe" type="checkbox" /> Wireframe</label><label class="check"><input id="reference" type="checkbox" checked /> Citizen for scale</label><div class="atelier-buttons"><button id="turn">Turn model</button><button id="reset">Reset camera</button><button id="light" aria-pressed="false">Golden hour</button></div><p class="note">Dashed border = legal footprint.<br />One grid cell = 1.25 world units.<br />Front faces +Z. Ground is y = 0.</p></aside>
    <footer><span class="controls">Drag to orbit <b>·</b> Scroll to zoom <b>·</b> Right-drag to pan</span><span class="study-label">Static model review · No game state</span></footer>
    <div id="status" role="status">Opening the atelier…</div>
    <script type="module" src="/src/art-viewer.ts"></script>
  </body>
</html>
