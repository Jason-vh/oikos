<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dbe7df" />
    <title>Oikos — Harbour study</title>
  </head>
  <body>
    <main id="app" aria-label="Interactive 3D Greek harbour"></main>
    <header class="masthead">
      <div class="identity"><span class="eyebrow">Art direction · Harbour study</span><h1><a href="/">Oikos</a><span> / Οἶκος</span></h1></div>
      <nav aria-label="Camera views"><button data-view="harbour" aria-pressed="true">Harbour</button><button data-view="streets" aria-pressed="false">Streets</button><button data-view="islands" aria-pressed="false">Archipelago</button></nav>
    </header>
    <aside class="caption"><span class="eyebrow">Painted wood · Sun-warmed stone</span><h2>A small port.<br />A wider world.</h2><p>Olive groves, terracotta rooftops, and a sea<br class="desktop-break" /> that leads somewhere new.</p><div class="palette" aria-label="Limestone, terracotta, olive, Aegean blue and saffron"><i></i><i></i><i></i><i></i><i></i></div></aside>
    <footer><span class="controls">Drag to orbit <b>·</b> Scroll to zoom <b>·</b> Right-drag to pan</span><div class="tools"><button id="motion" aria-pressed="false">Pause life</button><button id="light" aria-pressed="false">Golden hour</button><button id="reset">Reset view</button></div><span class="study-label">Art prototype · Not a simulation</span></footer>
    <div id="status" role="status">Opening the harbour…</div>
    <script type="module" src="/src/miniature/main.ts"></script>
  </body>
</html>
